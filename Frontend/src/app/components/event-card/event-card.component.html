@if(event){
  <!-- Card de evento -->
  <article class="event-card card h-100">
    <div class="event-card__image">
      <img
        src="https://placehold.co/600x350/212529/ffffff?text=Evento"
        class="card-img-top"
        alt="Imagen del evento"
      />

      <span class="event-card__status" [class]="'event-card__status event-card__status--' + statusModifier">
        {{ event.estado }}
      </span>
    </div>

    <div class="card-body event-card__body">
      <div class="event-card__location">
        <i class="bi bi-geo-alt"></i>
        <span>{{ event.teatro }} · {{ event.ciudad }}</span>
      </div>

      <h3 class="event-card__title">
        {{ event.nombre }}
      </h3>

      <div class="event-card__date">
        <i class="bi bi-calendar-event"></i>
        <span>{{ event.fecha_inicio | date: "d 'de' MMMM 'de' y, h:mm a" }}</span>
      </div>

      <div class="event-card__date">
        <i class="bi bi-ticket-perforated"></i>
        <span>{{ event.precio | currency: 'COP' : 'symbol-narrow' : '1.0-0' }} · {{ event.capacidad }} cupos</span>
      </div>

      <div class="event-card__footer">
        <a href="#" class="btn btn-primary w-100">
          Ver evento
        </a>
      </div>
    </div>
  </article>
}
